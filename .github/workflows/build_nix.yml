
name: Build on Ubuntu

on:
  pull_request:

env:
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/download/latest

jobs:
  build:
    name: Ubuntu
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - run: |
        sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev
        $CURL_GET -o mkn ${PATH_GET}/mkn_nix
        chmod +x mkn
        PATH="$PWD:$PATH" ./mkn.sh
        ./mkn clean build -dtOa -fPIC -p dep
